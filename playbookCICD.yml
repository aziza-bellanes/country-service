
---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: ./
    docker_registry_username: zaabella
    docker_registry_password: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: true

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        source: build
        build:
          path: "{{ dockerfile_path }}"
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        push: true
        source: local

    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        source: pull

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: ansible/deployment.yaml
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: ansible/service.yaml
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
